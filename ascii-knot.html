<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCII Knot</title>
<style>
  :root {
    --bg: #1c1c1b;
    --ink: 128, 192, 238; /* pale blue, as r,g,b */
  }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const ink = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim();
  const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---- Character grid ----
  const FONT_PX = 11;
  const CELL_W = 7;    // horizontal spacing per glyph
  const CELL_H = 12;   // line height
  const GLYPHS = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  let cols, rows, dpr, zbuf, light, chars;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cols = Math.ceil(innerWidth / CELL_W);
    rows = Math.ceil(innerHeight / CELL_H);
    zbuf = new Float32Array(cols * rows);
    light = new Float32Array(cols * rows);
    chars = new Uint8Array(cols * rows);
    for (let i = 0; i < chars.length; i++) chars[i] = (Math.random() * GLYPHS.length) | 0;
  }

  // ---- Geometry: a thick tube swept along a (2,3) torus knot ----
  const P = 2, Q = 3;
  const TUBE_R = 0.5;
  const U_STEPS = 1800, V_STEPS = 72;
  const N = U_STEPS * V_STEPS;
  const pos = new Float32Array(N * 3);
  const nrm = new Float32Array(N * 3);

  function knot(t) {
    const r = 2 + Math.cos(Q * t);
    return [r * Math.cos(P * t), r * Math.sin(P * t), -Math.sin(Q * t)];
  }
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };

  (function build() {
    const h = 1e-3;
    let k = 0;
    for (let i = 0; i < U_STEPS; i++) {
      const t = (i / U_STEPS) * Math.PI * 2;
      const c = knot(t), a = knot(t - h), b = knot(t + h);
      const T = norm(sub(b, a));
      const acc = [b[0] - 2 * c[0] + a[0], b[1] - 2 * c[1] + a[1], b[2] - 2 * c[2] + a[2]];
      const Nn = norm(sub(acc, T.map(x => x * dot(acc, T))));
      const B = cross(T, Nn);
      for (let j = 0; j < V_STEPS; j++) {
        const v = (j / V_STEPS) * Math.PI * 2;
        const cv = Math.cos(v), sv = Math.sin(v);
        const nx = Nn[0] * cv + B[0] * sv, ny = Nn[1] * cv + B[1] * sv, nz = Nn[2] * cv + B[2] * sv;
        pos[k] = c[0] + TUBE_R * nx; nrm[k++] = nx;
        pos[k] = c[1] + TUBE_R * ny; nrm[k++] = ny;
        pos[k] = c[2] + TUBE_R * nz; nrm[k++] = nz;
      }
    }
  })();

  // Light from upper-left, slightly toward the viewer
  const L = norm([-0.5, -0.6, -0.65]);

  function frame(ms) {
    const t = ms / 1000;
    const W = innerWidth, H = innerHeight;

    // Slow tumble on three axes
    const ax = 0.9 + t * 0.11, ay = t * 0.17, az = t * 0.05;
    const cx = Math.cos(ax), sx = Math.sin(ax), cy = Math.cos(ay), sy = Math.sin(ay), cz = Math.cos(az), sz = Math.sin(az);
    // R = Rz * Ry * Rx
    const m00 = cz * cy, m01 = cz * sy * sx - sz * cx, m02 = cz * sy * cx + sz * sx;
    const m10 = sz * cy, m11 = sz * sy * sx + cz * cx, m12 = sz * sy * cx - cz * sx;
    const m20 = -sy,     m21 = cy * sx,                m22 = cy * cx;

    const camDist = 7.5;
    // Big enough that the loops spill past the edges, like the reference
    const scale = Math.max(W, H) * 0.92;
    const ox = W * 0.55 + Math.sin(t * 0.07) * W * 0.04;
    const oy = H * 0.5 + Math.cos(t * 0.09) * H * 0.04;

    zbuf.fill(Infinity);
    light.fill(0);

    for (let i = 0, k = 0; i < N; i++, k += 3) {
      const px = pos[k], py = pos[k + 1], pz = pos[k + 2];
      const x = m00 * px + m01 * py + m02 * pz;
      const y = m10 * px + m11 * py + m12 * pz;
      const z = m20 * px + m21 * py + m22 * pz + camDist;
      const inv = 1 / z;
      const sxp = ox + x * scale * inv;
      const syp = oy + y * scale * inv;
      const col = (sxp / CELL_W) | 0, row = (syp / CELL_H) | 0;
      if (col < 0 || row < 0 || col >= cols || row >= rows) continue;
      const idx = row * cols + col;
      if (z >= zbuf[idx]) continue;

      const qx = nrm[k], qy = nrm[k + 1], qz = nrm[k + 2];
      const nx = m00 * qx + m01 * qy + m02 * qz;
      const ny = m10 * qx + m11 * qy + m12 * qz;
      const nz = m20 * qx + m21 * qy + m22 * qz;
      if (nz > 0.25) continue; // back-facing; let the front surface win
      zbuf[idx] = z;

      const diff = Math.max(0, nx * L[0] + ny * L[1] + nz * L[2]);
      const rim = Math.pow(1 - Math.abs(nz), 3) * 0.25;
      const depth = Math.min(1, Math.max(0.25, (camDist + 3.2 - z) / 6));
      light[idx] = (0.2 + diff * 0.8 + rim) * depth;
    }

    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
    ctx.font = `${FONT_PX}px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;
    ctx.textBaseline = 'top';

    // Bucket cells by brightness so we only change fillStyle a few times per frame
    const LEVELS = 12;
    const buckets = Array.from({ length: LEVELS }, () => []);
    for (let i = 0; i < light.length; i++) {
      const b = light[i];
      if (b < 0.06) continue;
      // Shimmer: glyphs re-roll at random, a little more often where it's bright
      if (!reduceMotion && Math.random() < 0.02 + b * 0.04) chars[i] = (Math.random() * GLYPHS.length) | 0;
      buckets[Math.min(LEVELS - 1, (b * LEVELS) | 0)].push(i);
    }
    for (let l = 0; l < LEVELS; l++) {
      const list = buckets[l];
      if (!list.length) continue;
      const a = Math.pow((l + 0.5) / LEVELS, 1.3) * 0.95;
      ctx.fillStyle = `rgba(${ink}, ${a.toFixed(3)})`;
      for (const i of list) {
        const row = (i / cols) | 0, col = i - row * cols;
        ctx.fillText(GLYPHS[chars[i]], col * CELL_W, row * CELL_H);
      }
    }

    if (!reduceMotion) requestAnimationFrame(frame);
  }

  resize();
  addEventListener('resize', () => { resize(); if (reduceMotion) frame(8000); });
  if (reduceMotion) frame(8000); else requestAnimationFrame(frame);
})();
</script>
</body>
</html>
