<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCII Ripple</title>
<style>
  :root {
    --bg: #1c1c1b;
    --ink: 128, 192, 238; /* pale blue, as r,g,b */
  }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: pointer; touch-action: none; }
  .hint {
    position: fixed; left: 0; right: 0; bottom: 24px; text-align: center;
    font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color: rgba(var(--ink), 0.45); pointer-events: none; transition: opacity 0.8s;
  }
  .hint.gone { opacity: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint" id="hint">click anywhere</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const hint = document.getElementById('hint');
  const ctx = canvas.getContext('2d');
  // Optional colours from the link, e.g. ascii-ripple.html?ink=74C476&bg=1c1c1b
  const params = new URLSearchParams(location.search);
  const hexParam = name => {
    const v = params.get(name);
    return /^[0-9a-f]{6}$/i.test(v || '') ? v.match(/../g).map(h => parseInt(h, 16)) : null;
  };
  const inkParam = hexParam('ink'), bgParam = hexParam('bg');
  if (inkParam) document.documentElement.style.setProperty('--ink', inkParam.join(', '));
  if (bgParam) document.documentElement.style.setProperty('--bg', `rgb(${bgParam.join(', ')})`);
  const rootStyle = getComputedStyle(document.documentElement);
  const ink = rootStyle.getPropertyValue('--ink').trim();
  const bg = rootStyle.getPropertyValue('--bg').trim();

  // ---- Character grid ----
  const FONT_PX = 11;
  const CELL_W = 7;    // horizontal spacing per glyph
  const CELL_H = 12;   // line height
  const GLYPHS = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  const BASE = 0.07;   // how visible the resting text is
  const PEAK = 0.6;    // how bright a ripple crest gets
  const CHURN = 1.2;   // resting glyph changes per second, per character
  const CHURN_WAVE = 4; // extra changes per second where the water is moving

  // ---- Water simulation (square cells so rings stay round) ----
  const SIM = 5;           // px per sim cell
  const SPEED = 0.28;      // average wave speed squared, in cells per step
  const SPEED_VARY = 0.45; // how uneven the water is; rings bend where it's faster or slower
  const DAMPING = 0.988;   // per step; lower = ripples die sooner
  const STEPS_PER_SEC = 90; // sim steps per second; higher = faster waves (~250px/s)
  const GAIN = 1.5;        // wave height -> brightness
  const SHEEN = 9;         // how strongly slopes facing the light catch it
  const WOBBLE = 7;        // px the picture drifts and sways, like looking through moving water
  const FLOOR = 0.12;      // brightness below this stays dark, so faint wake doesn't speckle
  const HEART_CHANCE = 0.3; // share of clicks that ripple out as a heart (shift-click always does)

  let W, H, cols, rows, chars, sw, sh, cur, prev, speed;

  function resize() {
    W = innerWidth; H = innerHeight;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cols = Math.ceil(W / CELL_W);
    rows = Math.ceil(H / CELL_H);
    chars = new Uint8Array(cols * rows);
    for (let i = 0; i < chars.length; i++) chars[i] = (Math.random() * GLYPHS.length) | 0;
    sw = Math.ceil(W / SIM) + 2;
    sh = Math.ceil(H / SIM) + 2;
    cur = new Float32Array(sw * sh);
    prev = new Float32Array(sw * sh);
    speed = new Float32Array(sw * sh);
    hearts.length = 0;
  }

  // Smooth, slowly drifting pattern in roughly [-1, 1] (a few layered sines)
  function flow(x, y, t) {
    return (
      Math.sin(x * 0.021 + y * 0.008 + t * 0.31) * 0.45 +
      Math.sin(y * 0.026 - x * 0.012 - t * 0.23 + 1.7) * 0.35 +
      Math.sin((x + y) * 0.041 + t * 0.47 + 4.1) * 0.2
    );
  }

  // Uneven depth: wave speed varies across the screen and drifts over time
  function updateSpeed(t) {
    for (let y = 0, i = 0; y < sh; y++) {
      for (let x = 0; x < sw; x++, i++) {
        speed[i] = SPEED * (1 + SPEED_VARY * flow(x * SIM, y * SIM, t));
      }
    }
  }

  function bump(cx, cy, R, amp, stretch, angle) {
    const ca = Math.cos(angle), sa = Math.sin(angle);
    const reach = R * stretch;
    for (let y = Math.max(1, (cy - reach) | 0); y <= Math.min(sh - 2, (cy + reach) | 0); y++) {
      for (let x = Math.max(1, (cx - reach) | 0); x <= Math.min(sw - 2, (cx + reach) | 0); x++) {
        const dx = x - cx, dy = y - cy;
        const u = (dx * ca + dy * sa) / stretch, v = -dx * sa + dy * ca;
        const d = Math.hypot(u, v) / R;
        if (d < 1) cur[y * sw + x] += amp * (0.5 + 0.5 * Math.cos(Math.PI * d));
      }
    }
  }

  // An uneven splash: a main blob plus a few smaller off-centre ones, so no two rings match
  function drop(px, py, strength = 0.7) {
    const cx = px / SIM + 1, cy = py / SIM + 1;
    const rand = (a, b) => a + Math.random() * (b - a);
    bump(cx, cy, rand(9, 13), strength * rand(0.85, 1.1), rand(1, 1.4), rand(0, Math.PI));
    const extra = 2 + ((Math.random() * 3) | 0);
    for (let k = 0; k < extra; k++) {
      const a = rand(0, Math.PI * 2), r = rand(3, 9);
      bump(cx + Math.cos(a) * r, cy + Math.sin(a) * r, rand(4, 8), strength * rand(-0.35, 0.45), rand(1, 1.8), rand(0, Math.PI));
    }
  }

  // A heart that grows outward for a moment, pushing the water as it goes. Its edge
  // travels at about wave speed, so the ripple it leaves keeps the heart outline.
  const hearts = [];
  const HEART_LIFE = 50;    // steps the heart keeps growing
  const HEART_GROW = 0.5;   // cells per step, close to wave speed

  function heart(px, py) {
    hearts.push({
      cx: px / SIM + 1, cy: py / SIM + 1, age: 0,
      r0: 3 + Math.random() * 2,
      tilt: (Math.random() - 0.5) * 0.6,      // up to ~17 degrees either way
      squash: 0.85 + Math.random() * 0.3,     // a little wider or taller each time
    });
  }

  function pushHearts() {
    for (let h = hearts.length - 1; h >= 0; h--) {
      const o = hearts[h];
      const r = o.r0 + o.age * HEART_GROW;
      const amp = 0.028 * (1 - o.age / HEART_LIFE);
      const n = Math.ceil(r * 8) + 16;
      const ca = Math.cos(o.tilt), sa = Math.sin(o.tilt);
      for (let k = 0; k < n; k++) {
        const t = (k / n) * Math.PI * 2;
        // Classic heart curve, scaled so its width is about 2r; screen y points down
        const hx = 16 * Math.sin(t) ** 3 / 16 * r * o.squash;
        const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 16 * r + r * 0.15;
        const x = Math.round(o.cx + hx * ca - hy * sa);
        const y = Math.round(o.cy + hx * sa + hy * ca);
        if (x < 2 || y < 2 || x >= sw - 2 || y >= sh - 2) continue;
        const i = y * sw + x;
        cur[i] += amp;
        cur[i - 1] += amp * 0.5; cur[i + 1] += amp * 0.5;
        cur[i - sw] += amp * 0.5; cur[i + sw] += amp * 0.5;
      }
      if (++o.age >= HEART_LIFE) hearts.splice(h, 1);
    }
  }

  function step() {
    pushHearts();
    // Wave equation with a 9-point Laplacian, which keeps rings round instead of square.
    for (let y = 1; y < sh - 1; y++) {
      let i = y * sw + 1;
      for (let x = 1; x < sw - 1; x++, i++) {
        const edge = cur[i - 1] + cur[i + 1] + cur[i - sw] + cur[i + sw];
        const corner = cur[i - sw - 1] + cur[i - sw + 1] + cur[i + sw - 1] + cur[i + sw + 1];
        const lap = (4 * edge + corner - 20 * cur[i]) / 6;
        prev[i] = (2 * cur[i] - prev[i] + speed[i] * lap) * DAMPING;
      }
    }
    const t = prev; prev = cur; cur = t;
  }

  function sample(px, py) {
    // Bilinear read of the height field at a pixel position
    const fx = Math.max(0, Math.min(sw - 1.001, px / SIM + 1));
    const fy = Math.max(0, Math.min(sh - 1.001, py / SIM + 1));
    const x0 = fx | 0, y0 = fy | 0;
    const tx = fx - x0, ty = fy - y0, i = y0 * sw + x0;
    const a = cur[i] + (cur[i + 1] - cur[i]) * tx;
    const b = cur[i + sw] + (cur[i + sw + 1] - cur[i + sw]) * tx;
    return a + (b - a) * ty;
  }

  const LEVELS = 16;
  const buckets = Array.from({ length: LEVELS }, () => []);
  const levelStyle = Array.from({ length: LEVELS }, (_, l) => {
    const b = l / (LEVELS - 1);
    return `rgba(${ink}, ${(BASE + (PEAK - BASE) * Math.pow(b, 1.4)).toFixed(3)})`;
  });

  // Light comes from the upper left
  const LX = -0.6, LY = -0.8;

  let last = 0, pending = 0;
  function frame(ms) {
    const t = ms / 1000;
    // Step on real time, not frame count, so 60Hz and 120Hz screens look the same
    const dt = Math.min(0.1, last ? (ms - last) / 1000 : 0);
    pending += dt * STEPS_PER_SEC;
    last = ms;
    if (pending >= 1) updateSpeed(t);
    for (; pending >= 1; pending--) step();

    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
    ctx.font = `${FONT_PX}px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace`;
    ctx.textBaseline = 'top';

    for (const b of buckets) b.length = 0;
    for (let row = 0, i = 0; row < rows; row++) {
      const cy = row * CELL_H + CELL_H / 2;
      for (let col = 0; col < cols; col++, i++) {
        const cx = col * CELL_W + CELL_W / 2;
        // Read the water through a gentle sway, so ring edges drift and bend
        const px = cx + WOBBLE * flow(cy * 1.3, cx * 0.7, t * 1.6);
        const py = cy + WOBBLE * flow(cx * 1.1 + 300, cy * 0.9, t * 1.4);
        const h = sample(px, py);
        // Slopes facing the light catch a sheen; the far side of a crest stays darker
        const gx = sample(px + SIM, py) - sample(px - SIM, py);
        const gy = sample(px, py + SIM) - sample(px, py - SIM);
        const lit = -(gx * LX + gy * LY);
        let b = Math.abs(h) * GAIN * 0.6 + Math.max(0, lit) * SHEEN - Math.max(0, -lit) * SHEEN * 0.35;
        b = Math.min(1, Math.max(0, b));
        b = b < FLOOR ? 0 : (b - FLOOR) / (1 - FLOOR);
        // Shimmer: glyphs keep re-rolling everywhere, faster where the water is moving
        if (Math.random() < dt * (CHURN + b * CHURN_WAVE)) chars[i] = (Math.random() * GLYPHS.length) | 0;
        buckets[Math.min(LEVELS - 1, Math.round(b * (LEVELS - 1)))].push(i);
      }
    }
    for (let l = 0; l < LEVELS; l++) {
      const list = buckets[l];
      if (!list.length) continue;
      ctx.fillStyle = levelStyle[l];
      for (const i of list) {
        const row = (i / cols) | 0, col = i - row * cols;
        ctx.fillText(GLYPHS[chars[i]], col * CELL_W, row * CELL_H);
      }
    }
    requestAnimationFrame(frame);
  }

  canvas.addEventListener('pointerdown', e => {
    if (e.shiftKey || Math.random() < HEART_CHANCE) heart(e.clientX, e.clientY);
    else drop(e.clientX, e.clientY);
    hint.classList.add('gone');
  });

  resize();
  updateSpeed(0);
  addEventListener('resize', resize);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
