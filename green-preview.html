<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Green Preview</title>
<style>
  :root { --bg: #141414; --fg: #d8d8d4; --muted: #8a8a85; --line: #2c2c2a; --ring: #e8e8e4; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
  body { display: flex; flex-direction: column; font: 13px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  header { padding: 12px 16px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .label { width: 92px; color: var(--muted); }
  button {
    width: 30px; height: 30px; border-radius: 50%; border: 1px solid #ffffff22; padding: 0; cursor: pointer;
    outline-offset: 3px;
  }
  button[aria-pressed="true"] { outline: 2px solid var(--ring); }
  button:focus-visible { outline: 2px dashed var(--ring); }
  .choice { color: var(--muted); }
  .choice b { color: var(--fg); font-weight: 500; }
  iframe { flex: 1; width: 100%; border: 0; display: block; }
  @media (max-width: 520px) { .label { width: 100%; } }
</style>
</head>
<body>
<header>
  <div class="row"><span class="label">text</span><span class="row" id="ink"></span></div>
  <div class="row"><span class="label">background</span><span class="row" id="bg"></span></div>
  <div class="choice" id="choice"></div>
</header>
<iframe id="view" title="Ripple preview"></iframe>
<script>
  const GREENS = ['F7FCF5', 'E5F5E0', 'C7E9C0', 'A1D99B', '74C476', '41AB5D', '238B45', '005A32'];
  const BGS = ['1C1C1B', '000000', ...GREENS];
  const state = { ink: 'A1D99B', bg: '1C1C1B' };
  const names = { '1C1C1B': 'current dark grey', '000000': 'black' };

  function swatches(id, list, key) {
    const wrap = document.getElementById(id);
    for (const hex of list) {
      const b = document.createElement('button');
      b.style.background = '#' + hex;
      b.title = names[hex] ? `#${hex} (${names[hex]})` : '#' + hex;
      b.setAttribute('aria-label', `${key === 'ink' ? 'Text' : 'Background'} #${hex}`);
      b.addEventListener('click', () => { state[key] = hex; render(); });
      wrap.appendChild(b);
    }
  }

  function render() {
    for (const key of ['ink', 'bg']) {
      for (const b of document.getElementById(key).children) {
        b.setAttribute('aria-pressed', b.title.startsWith('#' + state[key]));
      }
    }
    document.getElementById('choice').innerHTML =
      `text <b>#${state.ink}</b> on background <b>#${state.bg}</b>. Click in the preview for ripples, shift-click for a heart.`;
    document.getElementById('view').src = `ascii-ripple.html?ink=${state.ink}&bg=${state.bg}`;
  }

  swatches('ink', GREENS, 'ink');
  swatches('bg', BGS, 'bg');
  render();
</script>
</body>
</html>
